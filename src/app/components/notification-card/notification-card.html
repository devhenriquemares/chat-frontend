<div [ngClass]="cardClass()" 
        [class.dismiss]="isDismissing"
        (animationend)="onFinishAnimation()">
    <div class="w-full flex justify-end">
        <div (click)="onCloseClick()" 
            class="
            cursor-pointer
            mask-no-repeat mask-contain 
            h-10 w-10 bg-white" style="mask-image: url(/icons/reject_ic.svg)"></div>
    </div>
    <p [ngClass]="textClass()">{{ message() }}</p>
</div>
