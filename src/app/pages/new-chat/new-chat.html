<div class="flex flex-col h-full w-full">
    <div class="bg-gray w-full flex items-center px-4">
        <icon-circle-button (click)="closeView()" iconSrc="/icons/back_ic.svg" buttonCustomClass="shadow-none hover:shadow-none hover:translate-y-0" (click)="closeView()"/>
        <div class="w-full">
            <view-switcher leftOption="Ver requisições" rightOption="Enviar requisição" (leftClickEmitter)="handleLeftClick()" (rightClickEmitter)="handleRightClick()" [optionSelected]="optionSelected()"/>
        </div>
    </div>
    <div class="flex-1 p-5 flex flex-col">
        @if (optionSelected() === "Left") {

        } @else {
            <div class="flex w-full gap-5 items-center">
                <app-input type="text" placeholder="Digite o ID de um usuário" customClass="bg-white placeholder:text-[rgba(0,0,0,.5)] rounded-xl text-black"/>
                <icon-circle-button (click)="closeView()" iconSrc="/icons/search_ic.svg" buttonCustomClass="shadow-none hover:shadow-none hover:translate-y-0"/>
            </div>
        }
    </div>
</div>
